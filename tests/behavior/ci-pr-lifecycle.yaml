schema-version: 1
skill: ci-pr-lifecycle

positive-cases:
  - id: read-only-pr-check
    prompt: Check whether PR 184 is ready. Inspect its current head, reviews, and remote CI, but change nothing.
    expected:
      invocation: invoke
      invariants:
        - Selects read-only check mode and inspects revision, diff scope, base relationship, pull request, reviews, and remote checks.
        - Classifies each required check by current terminal or non-terminal state and rejects stale evidence from earlier revisions.
        - Reports concrete blockers and does not push, retry, comment, relabel, edit the PR, or merge it.
  - id: explicitly-drive-pr
    prompt: >-
      Push the current verified branch, create a draft PR against main, and follow required
      CI to terminal status. Do not merge it.
    expected:
      invocation: invoke
      invariants:
        - Selects drive mode only for the explicitly authorized push, PR creation, and monitoring actions.
        - Confirms intended branch, base, current revision, complete diff, and required local verification before mutation.
        - Reads remote state back after every mutation and reports the final remote revision and terminal results.
        - Never merges, enables automatic merge, or bypasses required checks.

negative-cases:
  - id: implement-ci-failure-fix
    prompt: Fix the TypeScript error reported by CI and verify the code change locally.
    expected:
      invocation: do-not-invoke
      preferred-skill: implement
      invariants:
        - Does not treat implementation permission as authorization to push, retry CI, or update a pull request.
  - id: review-local-diff
    prompt: Review this local diff for correctness and maintainability without touching the remote PR.
    expected:
      invocation: do-not-invoke
      preferred-skill: code-review
      invariants:
        - Does not contact or mutate remote lifecycle state for a local read-only code review.

overlap-cases:
  - id: verify-remote-readiness-but-never-merge
    competing-skill: verification-before-completion
    prompt: >-
      Verify that the current PR head satisfies local and remote required checks, then
      merge it if everything is green.
    expected:
      invocation: invoke
      co-invocation: verification-before-completion
      invariants:
        - Verification owns fresh claim-specific local evidence; CI lifecycle owns current remote head, review, and check evidence.
        - Treats green checks as readiness evidence, not authorization to merge.
        - Refuses to merge, enable automatic merge, or bypass checks under all modes.
